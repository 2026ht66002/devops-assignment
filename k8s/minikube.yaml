apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-gym
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
    spec:
      containers:
        - name: aceest-fitness-gym
          image: docker.io/2026ht66002/devops-assignment-2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-gym
spec:
  type: NodePort
  selector:
    app: aceest-fitness-gym
  ports:
    - port: 5000
      targetPort: 5000
